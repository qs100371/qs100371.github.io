      document.addEventListener('DOMContentLoaded', function () {
        const perf = window.performance || window.mozPerformance || window.msPerformance || window.webkitPerformance || {};
        const timing = perf.timing;
        let loadTime;
        if (timing && timing.loadEventEnd && timing.navigationStart) {
          loadTime = timing.loadEventEnd - timing.navigationStart;
        } else {
          loadTime = perf.now ? perf.now() : (Date.now() - (perf.timing?.navigationStart || Date.now()));
        }
        let displayTime;
        if (loadTime <= 0 || loadTime > 60000) { // 超过1分钟视为异常
          displayTime = 'N/A';
        } else if (loadTime < 1000) {
          displayTime = `${Math.round(loadTime)}ms`; // 毫秒
        } else {
          displayTime = `${(loadTime / 1000).toFixed(2)}s`; // 秒（保留2位小数）
        }

        function getColor(ms) {
          if (ms === 'N/A') return 'lightgrey';
          const time = typeof ms === 'number' ? ms : parseFloat(ms) * 1000;
          if (time < 800) return 'brightgreen';
          if (time < 1500) return 'green';
          if (time < 3000) return 'yellowgreen';
          if (time < 5000) return 'orange';
          return 'red';
        }

        const color = getColor(loadTime);
        const badgeUrl = `https://img.shields.io/badge/加载时间-${encodeURIComponent(displayTime)}-${color}`;
        document.getElementById('load-time-badge').src = badgeUrl;
      });

              <style>
                .highlight {
                  position: relative;
                  padding-top: 32px;
                  /* 为按钮预留空间 */
                }

                .highlight-copy-btn {
                  position: absolute;
                  top: 8px;
                  right: 8px;
                  z-index: 3;
                  padding: 4px 10px;
                  font-size: 12px;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                  color: #6e6e73;
                  background-color: #f5f5f7;
                  border: 1px solid #d2d2d7;
                  border-radius: 12px;
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  gap: 4px;
                  opacity: 0.5;
                  /* 始终显示 */
                  transition: all 0.2s ease;
                }

                .highlight-copy-btn:hover {
                  background-color: #e5e5ea;
                  border-color: #a2a2a7;
                }

                .highlight-copy-btn.copied {
                  color: #34c759;
                  background-color: #f0fdf4;
                  border-color: #86efac;
                }

                .highlight-copy-btn svg {
                  width: 14px;
                  height: 14px;
                }
              </style>
              <script>
                document.addEventListener('DOMContentLoaded', function () {
                  // 为所有代码块添加复制按钮
                  document.querySelectorAll('.highlight, figure.highlight, .code-block').forEach(function (highlight) {
                    // 创建按钮
                    const button = document.createElement('button');
                    button.className = 'highlight-copy-btn';
                    button.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="8" y="8" width="12" height="12" rx="2"></rect>
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
      </svg>
      <span>复制</span>
    `;

                    highlight.appendChild(button);

                    button.addEventListener('click', async function () {
                      try {
                        // 获取正确的代码内容
                        let codeElement = highlight.querySelector('pre code') ||
                          highlight.querySelector('td.code pre') ||
                          highlight.querySelector('code') ||
                          highlight.querySelector('pre');

                        if (!codeElement) {
                          console.error('找不到代码元素');
                          return;
                        }

                        // 获取文本并清理行号
                        let code = codeElement.innerText;
                        code = code.replace(/^\s*\d+\s/gm, '').trim();

                        // 使用现代API尝试复制
                        try {
                          await navigator.clipboard.writeText(code);
                        } catch (err) {
                          // 降级方案：使用textarea方法
                          const textarea = document.createElement('textarea');
                          textarea.value = code;
                          textarea.style.position = 'fixed';
                          document.body.appendChild(textarea);
                          textarea.select();
                          document.execCommand('copy');
                          document.body.removeChild(textarea);
                        }

                        // 更新按钮状态
                        button.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
          <span>已复制</span>
        `;
                        button.classList.add('copied');

                        // 2秒后恢复
                        setTimeout(() => {
                          button.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="8" y="8" width="12" height="12" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <span>复制</span>
          `;
                          button.classList.remove('copied');
                        }, 2000);

                      } catch (error) {
                        console.error('复制失败:', error);
                        button.textContent = '复制失败';
                        setTimeout(() => {
                          button.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="8" y="8" width="12" height="12" rx="2"></rect>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
            </svg>
            <span>复制</span>
          `;
                        }, 2000);
                      }
                    });
                  });
                });
              </script>
