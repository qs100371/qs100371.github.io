    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const perf = window.performance || window.mozPerformance || window.msPerformance || window.webkitPerformance || {};
        const timing = perf.timing;
        let loadTime;
        if (timing && timing.loadEventEnd && timing.navigationStart) {
          loadTime = timing.loadEventEnd - timing.navigationStart;
        } else {
          loadTime = perf.now ? perf.now() : (Date.now() - (perf.timing?.navigationStart || Date.now()));
        }
        let displayTime;
        if (loadTime <= 0 || loadTime > 60000) { // 超过1分钟视为异常
          displayTime = 'N/A';
        } else if (loadTime < 1000) {
          displayTime = `${Math.round(loadTime)}ms`; // 毫秒
        } else {
          displayTime = `${(loadTime / 1000).toFixed(2)}s`; // 秒（保留2位小数）
        }

        function getColor(ms) {
          if (ms === 'N/A') return 'lightgrey';
          const time = typeof ms === 'number' ? ms : parseFloat(ms) * 1000;
          if (time < 800) return 'brightgreen';
          if (time < 1500) return 'green';
          if (time < 3000) return 'yellowgreen';
          if (time < 5000) return 'orange';
          return 'red';
        }

        const color = getColor(loadTime);
        const badgeUrl = `https://img.shields.io/badge/加载时间-${encodeURIComponent(displayTime)}-${color}`;
        document.getElementById('load-time-badge').src = badgeUrl;
      });
    </script>
