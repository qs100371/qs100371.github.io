<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV在线播放器 - 优化版</title>
    <style>
        :root {
            --primary: #4ecca3;
            --primary-dark: #3db993;
            --secondary: #0f3460;
            --dark: #16213e;
            --darker: #1a1a2e;
            --light: #e6e6e6;
            --error: #e94560;
            --success: #4ecca3;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--darker);
            color: var(--light);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--dark) 0%, var(--secondary) 100%);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .subtitle {
            font-size: 1.1rem;
            color: var(--light);
            opacity: 0.8;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .player-section {
            flex: 1;
            min-width: 300px;
            background: var(--dark);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .playlist-section {
            flex: 1;
            min-width: 300px;
            background: var(--dark);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
            position: relative;
        }
        
        #video-player {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        
        .player-overlay.hidden {
            display: none;
        }
        
        .channel-info {
            padding: 15px;
            background: var(--secondary);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .channel-title {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: var(--primary);
        }
        
        .channel-url {
            font-size: 0.9rem;
            word-break: break-all;
            opacity: 0.8;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }
        
        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: var(--secondary);
            color: var(--light);
            font-size: 1rem;
        }
        
        button {
            background: var(--primary);
            color: var(--dark);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }
        
        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .channel-list {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 8px;
            background: var(--secondary);
        }
        
        .channel-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--darker);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .channel-item:hover {
            background: #1a5a9e;
        }
        
        .channel-item.active {
            background: var(--primary);
            color: var(--dark);
            font-weight: bold;
        }
        
        .channel-name {
            font-weight: 500;
        }
        
        .channel-group {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 3px;
        }
        
        .category-filter {
            margin-bottom: 15px;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #8f8f8f;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--primary);
        }
        
        .error {
            background: var(--error);
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        
        .success {
            background: var(--success);
            color: var(--dark);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        
        .source-presets {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .preset-btn {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .search-box {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>IPTV在线播放器</h1>
            <p class="subtitle">加载并播放您的IPTV直播源 - 优化版</p>
        </header>
        
        <div class="main-content">
            <section class="player-section">
                <div class="video-container">
                    <video id="video-player" controls>
                        您的浏览器不支持HTML5视频播放
                    </video>
                    <div class="player-overlay" id="player-overlay">
                        <h3>等待播放</h3>
                        <p>选择一个频道开始播放</p>
                    </div>
                </div>
                
                <div class="channel-info">
                    <div class="channel-title" id="channel-title">选择频道开始播放</div>
                    <div class="channel-url" id="channel-url">URL将显示在这里</div>
                </div>
                
                <div class="input-group">
                    <label for="playlist-url">IPTV播放列表URL (M3U格式)</label>
                    <input type="text" id="playlist-url" placeholder="输入M3U播放列表URL或上传本地文件">
                    
                    <div class="source-presets">
                        <button class="preset-btn" data-url="http://f1.qs100371.top:7002">测试源1</button>
                    </div>
                    
                    <button id="load-playlist">加载播放列表</button>
                    <input type="file" id="local-file" accept=".m3u,.m3u8" style="margin-top: 10px;">
                </div>
                
                <div id="message-area"></div>
            </section>
            
            <section class="playlist-section">
                <div class="input-group">
                    <label for="search-channel">搜索频道</label>
                    <input type="text" id="search-channel" placeholder="输入频道名称搜索">
                </div>
                
                <div class="input-group">
                    <label for="category-filter">筛选频道分类</label>
                    <select id="category-filter">
                        <option value="all">所有分类</option>
                    </select>
                </div>
                
                <div class="stats">
                    <span id="total-channels">频道总数: 0</span>
                    <span id="filtered-channels">显示: 0</span>
                </div>
                
                <div class="channel-list" id="channel-list">
                    <div class="loading">加载播放列表后，频道将显示在这里</div>
                </div>
            </section>
        </div>
        
        <footer>
            <p>IPTV在线播放器 | 仅供学习和测试使用</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoPlayer = document.getElementById('video-player');
            const playerOverlay = document.getElementById('player-overlay');
            const playlistUrlInput = document.getElementById('playlist-url');
            const loadPlaylistBtn = document.getElementById('load-playlist');
            const localFileInput = document.getElementById('local-file');
            const channelList = document.getElementById('channel-list');
            const categoryFilter = document.getElementById('category-filter');
            const searchChannelInput = document.getElementById('search-channel');
            const channelTitle = document.getElementById('channel-title');
            const channelUrl = document.getElementById('channel-url');
            const messageArea = document.getElementById('message-area');
            const totalChannelsSpan = document.getElementById('total-channels');
            const filteredChannelsSpan = document.getElementById('filtered-channels');
            const presetButtons = document.querySelectorAll('.preset-btn');
            
            let channels = [];
            let categories = new Set();
            let currentFilteredChannels = [];
            
            // 预设源按钮点击事件
            presetButtons.forEach(button => {
                button.addEventListener('click', function() {
                    playlistUrlInput.value = this.getAttribute('data-url');
                    loadPlaylistFromUrl();
                });
            });
            
            // 加载播放列表
            loadPlaylistBtn.addEventListener('click', loadPlaylistFromUrl);
            localFileInput.addEventListener('change', loadPlaylistFromFile);
            
            // 筛选和搜索
            categoryFilter.addEventListener('change', filterChannels);
            searchChannelInput.addEventListener('input', filterChannels);
            
            // 设置默认源
            playlistUrlInput.value = "http://f1.qs100371.top:7002";
            
            function loadPlaylistFromUrl() {
                const url = playlistUrlInput.value.trim();
                if (!url) {
                    showMessage('请输入有效的M3U播放列表URL', 'error');
                    return;
                }
                
                showMessage('正在加载播放列表...', 'loading');
                loadPlaylistBtn.disabled = true;
                loadPlaylistBtn.textContent = '加载中...';
                
                // 使用CORS代理绕过限制
                const proxyUrl = 'https://cros.qs100371.top/api/proxy?url=' + encodeURIComponent(url);
                
                fetch(proxyUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('网络响应不正常: ' + response.status);
                        }
                        return response.text();
                    })
                    .then(data => {
                        if (data.includes('#EXTM3U')) {
                            parseM3U(data);
                        } else {
                            // 如果不是标准M3U格式，尝试直接解析为频道列表
                            parseSimpleList(data, url);
                        }
                    })
                    .catch(error => {
                        showMessage('加载播放列表失败: ' + error.message, 'error');
                        console.error('加载错误:', error);
                    })
                    .finally(() => {
                        loadPlaylistBtn.disabled = false;
                        loadPlaylistBtn.textContent = '加载播放列表';
                    });
            }
            
            function loadPlaylistFromFile(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                showMessage('正在解析文件...', 'loading');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    parseM3U(e.target.result);
                };
                reader.onerror = function() {
                    showMessage('文件读取失败', 'error');
                };
                reader.readAsText(file);
            }
            
            function parseM3U(data) {
                channels = [];
                categories.clear();
                
                const lines = data.split('\n');
                let currentChannel = {};
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('#EXTINF:')) {
                        // 解析频道信息
                        const info = line.substring(8);
                        const commaIndex = info.indexOf(',');
                        
                        if (commaIndex !== -1) {
                            const attrs = info.substring(0, commaIndex);
                            const name = info.substring(commaIndex + 1);
                            
                            // 提取分组信息
                            const groupMatch = attrs.match(/group-title="([^"]*)"/);
                            const group = groupMatch ? groupMatch[1] : '未分类';
                            
                            // 提取台标
                            const logoMatch = attrs.match(/tvg-logo="([^"]*)"/);
                            const logo = logoMatch ? logoMatch[1] : '';
                            
                            currentChannel = {
                                name: name.replace(/\\/g, ''),
                                group: group,
                                url: '',
                                logo: logo
                            };
                            
                            categories.add(group);
                        }
                    } else if (line && !line.startsWith('#') && currentChannel.name) {
                        // 这是频道URL
                        currentChannel.url = line;
                        
                        // 如果URL是相对路径，尝试转换为绝对路径
                        if (currentChannel.url && !currentChannel.url.startsWith('http')) {
                            const baseUrl = playlistUrlInput.value;
                            const basePath = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
                            currentChannel.url = basePath + currentChannel.url;
                        }
                        
                        channels.push(currentChannel);
                        currentChannel = {};
                    }
                }
                
                if (channels.length === 0) {
                    showMessage('未找到有效频道，尝试其他解析方式', 'error');
                    parseSimpleList(data, playlistUrlInput.value);
                    return;
                }
                
                updateUI();
                showMessage(`成功加载 ${channels.length} 个频道`, 'success');
            }
            
            function parseSimpleList(data, baseUrl) {
                channels = [];
                categories.clear();
                
                const lines = data.split('\n');
                const basePath = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    if (line && !line.startsWith('#') && (line.includes('.m3u8') || line.includes('.ts') || line.includes('http'))) {
                        // 这可能是频道URL
                        const name = `频道 ${channels.length + 1}`;
                        const url = line.startsWith('http') ? line : basePath + line;
                        
                        channels.push({
                            name: name,
                            group: '未分类',
                            url: url,
                            logo: ''
                        });
                        
                        categories.add('未分类');
                    } else if (line.startsWith('#') && !line.startsWith('#EXT')) {
                        // 这可能是频道名称注释
                        const name = line.substring(1).trim();
                        if (name && i + 1 < lines.length) {
                            const nextLine = lines[i + 1].trim();
                            if (nextLine && !nextLine.startsWith('#') && 
                                (nextLine.includes('.m3u8') || nextLine.includes('.ts') || nextLine.includes('http'))) {
                                
                                const url = nextLine.startsWith('http') ? nextLine : basePath + nextLine;
                                
                                channels.push({
                                    name: name,
                                    group: '未分类',
                                    url: url,
                                    logo: ''
                                });
                                
                                categories.add('未分类');
                                i++; // 跳过下一行，因为已经处理了
                            }
                        }
                    }
                }
                
                updateUI();
                showMessage(`成功加载 ${channels.length} 个频道(简化解析)`, 'success');
            }
            
            function updateUI() {
                updateCategoryFilter();
                filterChannels();
                updateStats();
            }
            
            function updateCategoryFilter() {
                categoryFilter.innerHTML = '<option value="all">所有分类</option>';
                categories.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    categoryFilter.appendChild(option);
                });
            }
            
            function filterChannels() {
                const selectedCategory = categoryFilter.value;
                const searchTerm = searchChannelInput.value.toLowerCase();
                
                currentFilteredChannels = channels.filter(channel => {
                    const categoryMatch = selectedCategory === 'all' || channel.group === selectedCategory;
                    const searchMatch = channel.name.toLowerCase().includes(searchTerm) || 
                                       channel.group.toLowerCase().includes(searchTerm);
                    return categoryMatch && searchMatch;
                });
                
                displayChannels();
                updateStats();
            }
            
            function displayChannels() {
                channelList.innerHTML = '';
                
                if (currentFilteredChannels.length === 0) {
                    channelList.innerHTML = '<div class="loading">没有找到匹配的频道</div>';
                    return;
                }
                
                currentFilteredChannels.forEach(channel => {
                    const channelItem = document.createElement('div');
                    channelItem.className = 'channel-item';
                    channelItem.innerHTML = `
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-group">${channel.group}</div>
                    `;
                    
                    channelItem.addEventListener('click', () => {
                        // 移除所有active类
                        document.querySelectorAll('.channel-item').forEach(item => {
                            item.classList.remove('active');
                        });
                        
                        // 添加active类到当前项
                        channelItem.classList.add('active');
                        
                        // 播放频道
                        playChannel(channel);
                    });
                    
                    channelList.appendChild(channelItem);
                });
            }
            
            function updateStats() {
                totalChannelsSpan.textContent = `频道总数: ${channels.length}`;
                filteredChannelsSpan.textContent = `显示: ${currentFilteredChannels.length}`;
            }
            
            function playChannel(channel) {
                channelTitle.textContent = channel.name;
                channelUrl.textContent = channel.url;
                
                playerOverlay.classList.remove('hidden');
                playerOverlay.innerHTML = `
                    <h3>正在加载...</h3>
                    <p>${channel.name}</p>
                `;
                
                // 设置视频源
                videoPlayer.src = channel.url;
                videoPlayer.load();
                
                // 尝试播放
                const playPromise = videoPlayer.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // 播放成功
                        playerOverlay.classList.add('hidden');
                        showMessage(`正在播放: ${channel.name}`, 'success');
                    }).catch(error => {
                        playerOverlay.innerHTML = `
                            <h3>播放失败</h3>
                            <p>${error.message || '未知错误'}</p>
                            <button id="retry-play" style="margin-top: 10px; padding: 8px 16px;">重试</button>
                        `;
                        
                        document.getElementById('retry-play').addEventListener('click', () => {
                            playChannel(channel);
                        });
                        
                        showMessage('播放失败: ' + (error.message || '浏览器阻止自动播放'), 'error');
                    });
                }
            }
            
            function showMessage(message, type) {
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                // 5秒后自动清除消息（成功和加载消息除外）
                if (type !== 'success' && type !== 'loading') {
                    setTimeout(() => {
                        messageArea.innerHTML = '';
                    }, 5000);
                }
            }
            
            // 视频播放事件
            videoPlayer.addEventListener('waiting', () => {
                playerOverlay.classList.remove('hidden');
                playerOverlay.innerHTML = `<h3>缓冲中...</h3>`;
            });
            
            videoPlayer.addEventListener('playing', () => {
                playerOverlay.classList.add('hidden');
            });
            
            videoPlayer.addEventListener('error', () => {
                playerOverlay.classList.remove('hidden');
                playerOverlay.innerHTML = `
                    <h3>播放错误</h3>
                    <p>视频源可能无效或不受支持</p>
                    <button id="retry-play" style="margin-top: 10px; padding: 8px 16px;">重试</button>
                `;
                
                document.getElementById('retry-play').addEventListener('click', () => {
                    videoPlayer.load();
                    videoPlayer.play().catch(() => {
                        // 忽略错误，让事件处理程序处理
                    });
                });
            });
        });
    </script>
</body>
</html>
