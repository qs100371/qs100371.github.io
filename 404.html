      },

        try {
          const data = JSON.parse(itemStr)

            localStorage.removeItem(key)

          script.src = url
          script.async = true

          for (const key in attr) {
            script.setAttribute(key, attr[key])
          }

          script.onload = resolve
          script.onerror = reject

          document.head.appendChild(script)

          link.href = url

          }
