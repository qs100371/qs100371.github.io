      <p>Docker部署IPTV，200多电视节目，4K.8K秒切台</p>
<span id="more"></span>
<h1 id="部署"><a href="#部署" class="headerlink" title="部署"></a>部署</h1><figure class="highlight routeros"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line">docker <span class="built_in">run</span> -d --restart unless-stopped <span class="attribute">--net</span>=host <span class="attribute">--privileged</span>=<span class="literal">true</span> \</span><br><span class="line">     --name allinone youshandefeiyang/allinone</span><br><span class="line">docker <span class="built_in">run</span> -d --name watchtower --restart unless-stopped \</span><br><span class="line">     -v /var/run/docker.sock:/var/run/docker.sock \</span><br><span class="line">     containrrr/watchtower allinone -c --schedule <span class="string">&quot;0 0 2 * * *&quot;</span></span><br><span class="line">docker <span class="built_in">run</span> -d <span class="attribute">--restart</span>=always -p 35456:35456 \</span><br><span class="line">     --name allinone_format yuexuangu/allinone_format:latest</span><br></pre></td></tr></table></figure>
<h1 id="使用方法"><a href="#使用方法" class="headerlink" title="使用方法"></a>使用方法</h1><p>访问ip:35456，IPTV源地址：<a href="http://192.168.0.2:35456/m3u/2">http://192.168.0.2:35456/m3u/2</a></p>
<p><img src="https://qs100371.top/post-images/1733212608981.webp"></p>
