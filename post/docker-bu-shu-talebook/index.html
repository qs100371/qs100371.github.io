      <p>talebook是一个个人图书管理系统。</p>
<span id="more"></span>
<h1 id="部署"><a href="#部署" class="headerlink" title="部署"></a>部署</h1><figure class="highlight apache"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line"><span class="attribute">docker</span> run -d --name talebook <span class="punctuation">\</span></span><br><span class="line"><span class="punctuation"></span>-p <span class="number">8484</span>:<span class="number">80</span> -v /data/talebook:/data <span class="punctuation">\</span></span><br><span class="line"><span class="punctuation"></span> talebook/talebook</span><br></pre></td></tr></table></figure>
<p> docker-compose.yml：<br> <figure class="highlight nestedtext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br></pre></td><td class="code"><pre><span class="line"><span class="attribute">services</span><span class="punctuation">:</span></span><br><span class="line"> <span class="attribute">talebook</span><span class="punctuation">:</span></span><br><span class="line">   <span class="attribute">restart</span><span class="punctuation">:</span> <span class="string">unless-stopped</span></span><br><span class="line">   <span class="attribute">image</span><span class="punctuation">:</span> <span class="string">talebook/talebook</span></span><br><span class="line">   <span class="attribute">volumes</span><span class="punctuation">:</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">/data/talebook:/data</span></span><br><span class="line">   <span class="attribute">ports</span><span class="punctuation">:</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">&quot;8484:80&quot;</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">&quot;8443:443&quot;</span></span><br><span class="line">   <span class="attribute">environment</span><span class="punctuation">:</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">PUID=1000</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">PGID=1000</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">TZ=Asia/Shanghai</span></span><br><span class="line">   <span class="attribute">depends_on</span><span class="punctuation">:</span></span><br><span class="line">     <span class="bullet">-</span> <span class="string">douban-rs-api</span></span><br><span class="line"></span><br><span class="line"> <span class="comment"># optional, for meta plugins</span></span><br><span class="line"> <span class="comment"># please set &quot;http://douban-rs-api&quot; in settings</span></span><br><span class="line"> <span class="attribute">douban-rs-api</span><span class="punctuation">:</span></span><br><span class="line">   <span class="attribute">restart</span><span class="punctuation">:</span> <span class="string">unless-stopped</span></span><br><span class="line">   <span class="attribute">image</span><span class="punctuation">:</span> <span class="string">talebook/douban-api-rs</span></span><br></pre></td></tr></table></figure><br> douban-rs-api只能用在amd64。</p>
